expert_time_estimate_hours = 20

difficulty_explanation = """
Who does this, and why it is their job. A selection scan on population
resequencing data is a standard piece of work in evolutionary and population
genomics, and it is nearly always done the hard way described below rather
than by running one statistic. It is the analysis behind papers on local
adaptation in humans, Drosophila, Arabidopsis and threespine stickleback; it
is routine in applied surveillance, where the question is whether an
insecticide-resistance or antimalarial-resistance allele is sweeping through
a vector or parasite population and how fast; and it is routine in crop and
livestock genomics, where the targets of recent artificial selection are the
object of the study. The person doing it is typically a graduate student,
postdoc or staff scientist in a population-genetics group, and for them a
single dataset is days to weeks of work: fit a demographic model to the site
frequency spectrum (dadi, moments, stairwayplot, SMC++), simulate neutral
replicates under the fitted model on the real recombination map (msprime,
SLiM, discoal), run a battery of scan statistics (SweepFinder2, SweeD,
OmegaPlus, selscan for iHS and nSL, H12/H2H1 for soft sweeps) on both the
data and those replicates, and only then decide which regions are
candidates. The reason the pipeline is that long is the subject of this
task: the confounders are not a nuisance at the edges, they are the main
term.

What makes it intrinsically hard, as opposed to tedious. Three processes
leave the same local signature and only one of them is selection, so no
statistic and no threshold is interpretable on its own.

A bottleneck lowers diversity and skews the site frequency spectrum across
the whole genome, which is locally what a sweep does, and it also extends
linkage disequilibrium everywhere, which is what the haplotype statistics
respond to. A threshold taken from the genome's own distribution is
therefore a threshold on a distribution that already contains the thing
being tested for.

Recombination rate variation does the same thing locally. Low recombination
means fewer independent genealogies per window and therefore heavier tails
for every statistic, with no selection involved. Measured on ten neutral
replicates of this genome with no selection anywhere, a cut at the genome's
own 99.9th percentile fires 7 to 21 times more often inside the
recombination cold spots than outside them, depending on the statistic. The
map is given, so this is a rule to be worked out rather than a secret, but
working it out means simulating the null under the inferred history on that
map and comparing like with like on local rate.

And the modes of sweep separate on different statistics. A completed hard
sweep shows up in diversity and Tajima's D. An old one has lost its
haplotype signal to recombination, so H12 has decayed back towards
background. A sweep still segregating is the only kind carrying a long young
high-frequency haplotype, so nSL responds to it and to almost nothing else.
A sweep that arose repeatedly at the same site carries several frequent
haplotypes instead of one, so it barely depresses diversity at all and
pushes Tajima's D the opposite way from a hard sweep. A scan that is tuned
to find one of these reliably misses another.

The two quantities asked about each sweep, beyond where and what kind, are
relations an analyst has to derive and calibrate rather than look up. The
width of the diversity trough scales with s over the local recombination
rate; diversity at the centre recovers in proportion to the time since the
sweep finished. Both need constants fitted against simulations of the
inferred history, and the strengths here span a factor of nine and the ages
a factor of sixteen, so a single plausible number satisfies neither
requirement.

Expert time is around 20 hours. The largest single piece of it is null
calibration: deciding what the right null is, simulating it, and working out
which statistic to trust for which mode of sweep.

The data are synthetic, and deliberately so: the ground truth here is a list
of selected sites with known selection coefficients, ages and modes of
origin, which no real genome provides. They come from a forward simulation
in fwdpy11, recapitated with msprime under a bottleneck-and-expansion
history and overlaid with neutral mutations. The generator, its seeds and
the measurements used to set every threshold are in authoring/.
"""

solution_explanation = """
Fit the history first, then scan against it.

The reference infers the bottleneck-and-expansion history by simulated
method of moments: propose a history, simulate it with msprime, and compare
the binned unfolded spectrum and mean diversity with the observed ones,
computed over windows left after dropping the lowest-diversity decile so
that sweeps do not get absorbed into the demography. Every proposal reuses
one random seed, which turns a noisy objective into a deterministic one and
lets a coarse random search plus local refinement converge.

It then simulates ten neutral replicates under the fitted history using the
provided recombination map, and scans both the observed genome and the null
in 50 kb windows at a 10 kb step for diversity, Tajima's D, H12, H2/H1 and
the fraction of extreme nSL scores. Each observed window becomes a
rank-based empirical p-value against null windows in the same local-rate
bin, for six one-sided tests -- diversity low, Tajima's D low AND high, H12
high, H2/H1 low, extreme-nSL fraction high -- combined across the six as
-2 sum log p. Both directions of Tajima's D are there because soft sweeps
push it the opposite way from hard ones; in a Fisher combination a window
extreme in one tail has a p near one in the other and contributes nothing
from it, so the pair acts as a two-sided test rather than double-counting.

Calls are made at the level of clusters rather than single windows. A sweep
footprint spans one to two megabases, so asking any single window inside it
to clear a genome-wide per-window cut is the wrong test. Clusters are formed
by runs of windows above the null's 99th percentile of the combined score,
allowing gaps of up to ten windows, and judged by their total mass, the
summed excess over that forming threshold. The mass cut is calibrated by
applying the identical procedure to every null replicate, so the
false-positive budget is exact and is a budget on clusters, which is what a
call is. Clusters within 1.5 megabases of each other are then fused by
taking the union of their windows, because a footprint interrupted by a dip
in the score otherwise becomes two calls either side of the sweep. Each
call's reported position is the window of maximum H12 inside it, which is
the only locator measured to be good for every class.

Run end to end on a genome simulated under the same history and the same
recombination map but with no selection anywhere, the pipeline reports zero
sweeps.

Characterisation then uses fixed constants, fitted offline on 111
single-sweep replicates at 37 configurations and listed in
solution/pipeline/characterize.py. Every score below is held out by
CONFIGURATION, never by replicate: ten of those configurations are the
shipped sweeps' own, so holding out one replicate at a time would reward a
rule that had memorised a handful of (s, age) pairs.

The class comes from two logistic rules rather than one rule over four
classes, which is worth 80.2% four-way against 75.7% for the best
nearest-centroid rule on three features. First complete against partial,
from the floor of the diversity trough, the H12 elevation and the
standardized-nSL fraction (91.0%); then soft against hard with a rule fitted
for whichever completeness group the first rule chose -- the trough floor
with Tajima's D and H2/H1 among the completed sweeps (92.4%), and the extent
of the H12 elevation with H2/H1 among the partial ones (80.0%). Fitting
softness separately per group is what makes H2/H1 usable at all: pooled over
completed sweeps of every age it is confounded, because at an old hard sweep
recombination has broken up the swept block and H2/H1 has recovered into the
range a soft sweep occupies. Within a completeness group that confound is
gone, since every partial sweep is young.

The selection coefficient comes from a log-linear fit in two measured
features per class, s_hat = exp(a) * prod(feature_i ** b_i). The backbone is
the textbook relation, that a footprint extends to about s over the local
recombination rate, so every width feature is multiplied by the local rate:
what strength sets is the genetic length of the footprint, not its length in
base pairs. On its own, as trough width over one constant per class, that
relation put 74% of calibration replicates inside a factor of 2.5 and ranked
them at only 0.32, because a soft sweep leaves no trough whose width can be
measured. Only the completed hard sweeps therefore read their width from the
diversity trough; the other three classes read it from the extent of the H12
elevation, and each class pairs its width with a level feature -- diversity
at the peak for the two hard classes, H12 for the completed soft ones. Held
out by configuration that reaches 109 of 109 inside a factor of 2.5 with a
pooled rank correlation of +0.82.

The completion time comes from H12 decay with the footprint extent
controlling for strength, not from residual diversity: haplotype homozygosity
at a completed sweep falls back towards background as recombination breaks up
the swept block, and that dates a sweep better than how far below background
its diversity still sits -- 36 of 40 inside the verifier's tolerance with a
rank correlation of +0.93, against 9 of 16 for the diversity-depth clock. It
is reported for every call, whatever class the call was given, because the
date is read off the footprint rather than off the class.
"""


verification_explanation = """
Ground truth is the generator's own configuration plus the realized
trajectory the forward simulation recorded: the scheduled position of each
selected site, its selection coefficient, the generation at which the
beneficial allele passed 0.98 frequency, its final frequency, and how many
independent origins of it survived to the present. No solver, reference or
otherwise, contributes anything to it. The sealed truth file is static JSON,
and the verifier runs no simulation and needs no network at grading time; it
imports pytest and the standard library only.

Calls are deduplicated at 250 kb and then matched to true sweeps greedily by
ascending distance, same chromosome, within 250 kb, a window set from the
measured localisation spread of the best statistic for each class rather
than from the reference's own error.

The gates are conjunctive: ancestral and current population size each within
a factor of 1.6; the bottleneck's duration over its depth within a factor of
2.5; a structural check that the reported history really contracts and
recovers; recall of at least three of the four hard_complete sweeps and at
least one of each other class; at most one call matching no true sweep, with
cold-spot calls counting against that cap; the right class on at least 70%
of matched calls; selection coefficients within a factor of 2.5 on at least
70% of matched calls, spanning a range of at least a factor of 2 across
them, AND ranked against the true coefficients with a correlation of at
least 0.30; and at least three of the matched hard_complete sweeps dated to
within 50% or 150 generations, whichever is larger.

Four of those choices were forced by measurement rather than chosen for
neatness.

The bottleneck's depth and duration are not separately identifiable from the
spectrum, since the genealogy integrates duration over size. Across four
neutral replicates with known truth the reference was off by 2.4 to 2.6
times on depth alone while recovering the combination to within 1.14 to
1.48, so the gate is on the combination. The bottleneck's timing is not
graded at all: the same four fits placed the expansion at 0.64, 0.68, 1.31
and 2.63 times its true time, so one in four fails even a 40% tolerance and
any tolerance admitting 2.63 is vacuous. The objective has a broad flat
minimum spanning roughly 1500 to 4000 generations for a truth of 3000, which
is what a spectrum from 100 haplotypes contains rather than a failure of the
search.

A sweep's age is deliberately not part of its class. An earlier version of
this task split the completed hard sweeps into recent and old at a fixed
boundary, which put age inside the class label and let one constant per
class satisfy the timing gate without dating anything. The four classes are
now the two binary properties a scan can be asked to recover, crossed, and
age is graded only as a continuous quantity.

Completion time is graded only over sweeps whose TRUE class is
hard_complete, using the true class rather than the reported one so that a
misclassification is not punished twice. Diversity recovery dates a sweep by
how far below background its centre still sits, which presumes the sweep
drove diversity to zero; a soft sweep never did, so that clock has no zero
to start from and no estimator is known that recovers the age of one.
Grading a quantity nothing recovers would be grading noise.

Selection coefficients are graded three ways -- magnitude, spread and order
-- and the bundle does not pretend any one of them is enough. The shipped
coefficients span a factor of 9.4, so the magnitude test alone is weak:
authoring/evidence/gate_feasibility.py searches for the single coefficient
that satisfies the most magnitude tests and reports what it achieves. The
spread gate requires the reported coefficients to range over at least a
factor of 2, which no constant answer can do. The ordering gate requires a
rank correlation of at least 0.30; a constant produces nothing but ties,
which score zero by the verifier's own convention, so no constant passes
whatever its value. The honest limit of the pair is measured rather
than asserted: over 20,000 random answers per match set, a jittered constant
clears the ordering gate on 0.223 of tries at nine matched calls and 0.290
at the smallest match set the recall gates permit, so the worst case is
about one escape in 3.5. Raising the correlation threshold to close that gap would
start excluding methods that order sweeps correctly but coarsely, which is
the worse error for a benchmark.

That the gates are NOT trivially passable is the claim with the strongest
evidence, and it does not involve the reference at all. gate_feasibility.py
enumerates every assignment of calls to true sweeps that satisfies the recall
gates and searches for the best possible constant coefficient and the best
possible constant completion time against the shipped truth; twenty-eight
degenerate submissions, including the best constants that search finds and a
constant with noise added, go through the REAL verifier in
authoring/evidence/verifier_selftest.py.

That the gates are PASSABLE rests on three measurements, in increasing order
of how much they establish, and the first two are weaker than they look.

One: the reference clears all twelve gates. By itself this establishes
little. Its characterisation constants are fitted on single-sweep replicates
simulated under the TRUE demography rather than a fitted one, so it carries
no demographic-inference error a real analysis would, and ten of the 37
configurations those replicates cover are the shipped sweeps' own.

Two: the same pipeline with every characterisation constant re-SELECTED and
refitted on 60 replicates across 20 configurations the shipped replicate
never uses also clears every gate -- 9 matched calls, no false positives,
class right on 7 of 9, coefficients inside a factor of 2.5 on 8 of 9 with a
rank correlation of 0.517, all three localized hard_complete sweeps dated
inside tolerance (authoring/evidence/holdout_calibration.py). Nothing in that
version is fitted at a point it is graded on, but it is still the reference's
method.

Three: authoring/evidence/independent_solver.py is a structurally different
solver -- Nelder-Mead on four moments instead of L2 on a binned spectrum,
a sliding macro-window mean of rank scores instead of a Fisher combination
judged by cluster mass, linear discriminant analysis for the class, the
Tajima's D trough width for s, and a diversity-recovery clock -- calibrated
only on configurations the shipped replicate does not use. It clears 10 of
the 12 gates, including all four demography gates with a visibly different
history and all three coefficient gates with the best rank correlation of any
method here. It fails the false-positive cap, 2 against 1, and timing, 0 of
3, because its diversity-recovery clock dates every sweep about 2.5 times too
old. So the timing gate does separate a good clock from a poor one, and no
structurally independent implementation has yet been shown to clear it.
Tuning that solver until it passed would manufacture the very evidence this
exercise exists to test for, so it was left where three good-faith
improvement passes put it.

What none of this establishes is that an arbitrary correct method clears
every gate. The ablation table in README.md is not evidence for it either,
and no threshold was set from it: every row there is handed the reference's
own classification and estimation step on purpose, so the rows isolate
detection and calibration. The claim the bundle makes is the narrower one:
every gate is met by at least one method measured out of sample, two of the
twelve are met with no margin and those two are structural minima rather than
tuned values, and no gate is met by an answer that estimates nothing.

authoring/evidence/verifier_selftest.py runs the whole battery through the
real verifier against the shipped truth file, not a stand-in. The perfect
answer passes, and so does the perfect answer plus one false positive. The
rest fail: no file, an empty object, no sweeps, a carpet of calls every
100 kb, every call given one class, a constant coefficient at 0.3, at the
true geometric mean and at the best value a constant can take, the
coefficients correct in magnitude but reversed in rank, a constant
completion time at 300, at 1600 and at the best value a constant can take,
one constant time per class, every time doubled, a constant-size history,
each of the four classes dropped entirely, every position shifted 400 kb, a
NaN coefficient, complete sweeps submitted with no time at all, every call
parked at a chromosome centre, and the perfect answer plus three false
positives.
"""


