expert_time_estimate_hours = 20

difficulty_explanation = """
Who does this, and why it is their job. A selection scan on population
resequencing data is a standard piece of work in evolutionary and population
genomics, and it is nearly always done the hard way described below rather
than by running one statistic. It is the analysis behind papers on local
adaptation in humans, Drosophila, Arabidopsis and threespine stickleback; it
is routine in applied surveillance, where the question is whether an
insecticide-resistance or antimalarial-resistance allele is sweeping through
a vector or parasite population and how fast; and it is routine in crop and
livestock genomics, where the targets of recent artificial selection are the
object of the study. The person doing it is typically a graduate student,
postdoc or staff scientist in a population-genetics group, and for them a
single dataset is days to weeks of work: fit a demographic model to the site
frequency spectrum (dadi, moments, stairwayplot, SMC++), simulate neutral
replicates under the fitted model on the real recombination map (msprime,
SLiM, discoal), run a battery of scan statistics (SweepFinder2, SweeD,
OmegaPlus, selscan for iHS and nSL, H12/H2H1 for soft sweeps) on both the
data and those replicates, and only then decide which regions are
candidates. The reason the pipeline is that long is the subject of this
task: the confounders are not a nuisance at the edges, they are the main
term.

What makes it intrinsically hard, as opposed to tedious. Three processes
leave the same local signature and only one of them is selection, so no
statistic and no threshold is interpretable on its own.

A bottleneck lowers diversity and skews the site frequency spectrum across
the whole genome, which is locally what a sweep does, and it also extends
linkage disequilibrium everywhere, which is what the haplotype statistics
respond to. A threshold taken from the genome's own distribution is
therefore a threshold on a distribution that already contains the thing
being tested for.

Recombination rate variation does the same thing locally. Low recombination
means fewer independent genealogies per window and therefore heavier tails
for every statistic, with no selection involved. Measured on ten neutral
replicates of this genome with no selection anywhere, a cut at the genome's
own 99.9th percentile fires 7 to 21 times more often inside the
recombination cold spots than outside them, depending on the statistic. The
map is given, so this is a rule to be worked out rather than a secret, but
working it out means simulating the null under the inferred history on that
map and comparing like with like on local rate.

And the modes of sweep separate on different statistics. A completed hard
sweep shows up in diversity and Tajima's D. An old one has lost its
haplotype signal to recombination, so H12 has decayed back towards
background. A sweep still segregating is the only kind carrying a long young
high-frequency haplotype, so nSL responds to it and to almost nothing else.
A sweep that arose repeatedly at the same site carries several frequent
haplotypes instead of one, so it barely depresses diversity at all and
pushes Tajima's D the opposite way from a hard sweep. A scan that is tuned
to find one of these reliably misses another.

The two quantities asked about each sweep, beyond where and what kind, are
relations an analyst has to derive and calibrate rather than look up. The
width of the diversity trough scales with s over the local recombination
rate; diversity at the centre recovers in proportion to the time since the
sweep finished. Both need constants fitted against simulations of the
inferred history, and the strengths here span a factor of nine and the ages
a factor of sixteen, so a single plausible number satisfies neither
requirement.

Expert time is around 20 hours. The largest single piece of it is null
calibration: deciding what the right null is, simulating it, and working out
which statistic to trust for which mode of sweep.

The data are synthetic, and deliberately so: the ground truth here is a list
of selected sites with known selection coefficients, ages and modes of
origin, which no real genome provides. They come from a forward simulation
in fwdpy11, recapitated with msprime under a bottleneck-and-expansion
history and overlaid with neutral mutations. The generator, its seeds and
the measurements used to set every threshold are in authoring/.
"""

solution_explanation = """
Fit the history first, then scan against it.

The reference infers the bottleneck-and-expansion history by simulated method
of moments: propose a history, simulate it with msprime, and compare the
binned unfolded spectrum and mean diversity with the observed ones, computed
over windows left after dropping the lowest-diversity decile so that sweeps
do not get absorbed into the demography. Every proposal reuses one random
seed, which turns a noisy objective into a deterministic one and lets a
coarse random search plus local refinement converge.

It then simulates ten neutral replicates under the fitted history using the
provided recombination map, computes windowed diversity, Tajima's D, H12,
H2/H1 and the fraction of extreme nSL scores on both the observed genome and
the null, and converts each observed window to a z-score against null windows
in the same local-rate bin, combined across six statistics as -2 sum log p.
Calls are then made at the level of clusters rather than single windows,
formed at a mild threshold and judged by their total excess mass, with the
mass cut calibrated by applying the identical procedure to every null
replicate. A sweep footprint spans one to two megabases, so asking any single
window inside it to clear a genome-wide per-window cut is the wrong test:
measured on the shipped replicate the soft sweeps peaked a single point below
such a cut against a genome-wide median a quarter as large.

Run end to end on a genome simulated under the same history and the same
recombination map but with no selection anywhere, the pipeline reports zero
sweeps.

Classification is a nearest-centroid rule on four features read at the
detected peak: diversity and H2/H1 as ratios to background, Tajima's D and
the extreme-nSL fraction as differences. Single-feature thresholds are not
enough, and neither axis of the class scheme has a statistic that carries it
on its own. H2/H1, the textbook hard-versus-soft discriminator, is confounded
by age: at an old hard sweep recombination has broken up the swept block far
enough that H2/H1 has recovered into the range a soft sweep occupies.
Diversity, the obvious complete-versus-partial discriminator, is confounded
by softness: a soft completed sweep leaves diversity near background, like a
partial one. The combination separates them where no single feature does, and
the calibration is leave-one-out rather than in-sample.

The selection coefficient comes from the width of the diversity trough times
the local recombination rate, with the width measured as the contiguous span
recovering halfway from the trough's own floor to background rather than
crossing half of background, which the shallow classes never do. One constant
per class covers the whole range of strengths because the width scales with
s, which is also what makes the reported coefficients rank correctly rather
than merely land in the right decade.

The completion time comes from diversity recovery at the centre of the
trough, calibrated as a power law in the residual diversity rather than as a
proportionality with a per-class correction: one class now spans ages from
about a hundred to about two thousand generations, and residual diversity is
not linear in age over that range. It is reported for every sweep called
complete, because the submission schema requires a number there, but it is
only meaningful for the single-origin ones, which is also the only place the
verifier grades it.
"""

verification_explanation = """
Ground truth is the generator's own configuration plus the realized
trajectory the forward simulation recorded: the scheduled position of each
selected site, its selection coefficient, the generation at which the
beneficial allele passed 0.98 frequency, its final frequency, and how many
independent origins of it survived to the present. No solver, reference or
otherwise, contributes anything to it. The sealed truth file is static JSON,
and the verifier runs no simulation and needs no network at grading time; it
imports pytest and the standard library only.

Calls are deduplicated at 250 kb and then matched to true sweeps greedily by
ascending distance, same chromosome, within 250 kb, a window set from the
measured localisation spread of the best statistic for each class rather
than from the reference's own error.

The gates are conjunctive: ancestral and current population size each within
a factor of 1.6; the bottleneck's duration over its depth within a factor of
2.5; a structural check that the reported history really contracts and
recovers; recall of at least three of the four hard_complete sweeps and at
least one of each other class; at most one call matching no true sweep, with
cold-spot calls counting against that cap; the right class on at least 70%
of matched calls; selection coefficients within a factor of 2.5 on at least
70% of them AND a rank correlation of at least 0.50 against the true
coefficients; and at least three of the matched hard_complete sweeps dated
to within 50% or 150 generations, whichever is larger.

Four of those choices were forced by measurement rather than chosen for
neatness.

The bottleneck's depth and duration are not separately identifiable from the
spectrum, since the genealogy integrates duration over size. Across four
neutral replicates with known truth the reference was off by 2.4 to 2.6
times on depth alone while recovering the combination to within 1.14 to
1.48, so the gate is on the combination. The bottleneck's timing is not
graded at all: the same four fits placed the expansion at 0.64, 0.68, 1.31
and 2.63 times its true time, so one in four fails even a 40% tolerance and
any tolerance admitting 2.63 is vacuous. The objective has a broad flat
minimum spanning roughly 1500 to 4000 generations for a truth of 3000, which
is what a spectrum from 100 haplotypes contains rather than a failure of the
search.

A sweep's age is deliberately not part of its class. An earlier version of
this task split the completed hard sweeps into recent and old at a fixed
boundary, which put age inside the class label and let one constant per
class satisfy the timing gate without dating anything. The four classes are
now the two binary properties a scan can be asked to recover, crossed, and
age is graded only as a continuous quantity.

Completion time is graded only over sweeps whose TRUE class is
hard_complete, using the true class rather than the reported one so that a
misclassification is not punished twice. Diversity recovery dates a sweep by
how far below background its centre still sits, which presumes the sweep
drove diversity to zero; a soft sweep never did, so that clock has no zero
to start from and no estimator is known that recovers the age of one.
Grading a quantity nothing recovers would be grading noise.

Selection coefficients are graded on magnitude and on order, and the bundle
does not pretend the magnitude test is enough on its own: the shipped
coefficients span a factor of 9.4, and authoring/evidence/gate_feasibility.py
searches for the single coefficient that satisfies the most magnitude tests
and reports what it achieves. The ordering test is the one that cannot be
satisfied without measuring strength. A constant answer produces nothing but
ties, which score zero, so no constant passes whatever its value.

The three bounds on the thresholds rest on different evidence, and only one
of them involves the reference. That the gates are PASSABLE is measured on
independent single-sweep replicates, one chromosome and one sweep each,
simulated at several strengths per class, which the shipped genome had no
part in; every pass fraction sits below what was measured there, and the
demography gates rest on four independent neutral replicates with known
truth. That the gates are NOT TRIVIALLY PASSABLE is established without the
reference at all, by searching for the best possible constant coefficient
and the best possible constant completion time against the shipped truth and
by running those and twenty-odd other degenerate submissions through the
real verifier. The ablation table in README.md is neither of those and no
threshold was set from it: every row there is handed the reference's own
classification and estimation step on purpose, so the rows isolate detection
and calibration. What this does not establish is that a method unlike the
reference would pass; the claim is the narrower one, that every gate is met
by at least one honest method measured out of sample and none is met by an
answer that estimates nothing.

authoring/evidence/verifier_selftest.py runs the whole battery through the
real verifier against the shipped truth file, not a stand-in. The perfect
answer passes, and so does the perfect answer plus one false positive. The
rest fail: no file, an empty object, no sweeps, a carpet of calls every
100 kb, every call given one class, a constant coefficient at 0.3, at the
true geometric mean and at the best value a constant can take, the
coefficients correct in magnitude but reversed in rank, a constant
completion time at 300, at 1600 and at the best value a constant can take,
one constant time per class, every time doubled, a constant-size history,
each of the four classes dropped entirely, every position shifted 400 kb, a
NaN coefficient, complete sweeps submitted with no time at all, every call
parked at a chromosome centre, and the perfect answer plus three false
positives.
"""


