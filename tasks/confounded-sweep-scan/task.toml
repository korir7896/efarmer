expert_time_estimate_hours = 20

difficulty_explanation = """
The data are synthetic, and deliberately so: the ground truth here is a list
of selected sites with known selection coefficients, ages and modes of
origin, which no real genome provides. They come from a forward simulation in
fwdpy11 of a four-class sweep zoo, recapitated with msprime under a
bottleneck-and-expansion history and overlaid with neutral mutations. The
generator, its seeds and the measurements used to set every threshold are in
authoring/.

The task is hard because the three things that produce a sweep-like signal in
a genome scan are all present at once, and only one of them is selection.

A bottleneck lowers diversity and skews the site frequency spectrum
genome-wide, which is locally what a sweep does. On ten neutral replicates of
this genome, taking the genome's own 99.9th percentile as a cutoff fires 7 to
21 times more often inside the recombination cold spots than outside them,
purely because low recombination means fewer independent genealogies per
window and therefore heavier tails. The cold spots are given to the agent in
the recombination map, so applying them is a rule to be inferred rather than
a secret, but an agent that runs a scan at its defaults will report them.
Getting this right means inferring the history first, then simulating a null
under that history on that map, then comparing each window only against null
windows of comparable local recombination rate.

No single statistic finds all four classes, and each standard choice misses a
different one. Diversity and Tajima's D find completed hard sweeps but locate
a partial sweep poorly, with a measured median error of 380 kb against 25 kb
for H12. H12 collapses for old sweeps, where recombination has already eroded
the swept haplotype block: a measured ratio to background of 1.3 against 8.5
for recent ones. nSL reads near zero at any completed sweep, because the
sweep is over and no high-frequency young haplotype remains to carry a long
tract, so it responds to partial sweeps and little else.

The soft sweeps are the subtlest. Their diversity at the selected site sits
at 0.74 of background, barely depressed, so a diversity scan does not see
them and only H12 does. What identifies them is that Tajima's D at a soft
sweep is positive, measured at +0.21 to +1.15, where every other class is
negative with a maximum of -0.25: several frequent haplotypes leave an excess
of intermediate-frequency variants. The obvious discriminator does not work
here. H2/H1, normally the hard-versus-soft statistic, fails because at an old
hard sweep the swept block has decayed far enough that H2/H1 recovers to
0.46-0.99, overlapping the 0.27-0.62 measured at soft sweeps.

Dating and quantifying the sweeps needs relations an analyst has to derive
rather than look up. Both are available -- the width of the diversity trough
scales with s/r, and diversity at the centre recovers in proportion to the
time since the sweep finished -- but the constants have to be calibrated
against simulations of the inferred history, and the recovery estimator
carries a bias that depends on the class.

An expert spends a couple of days on this, mostly on the null calibration and
on working out which statistic to trust for which class.
"""

solution_explanation = """
Fit the history first, then scan against it.

The reference infers the bottleneck-and-expansion history by simulated method
of moments: propose a history, simulate it with msprime, and compare the
binned unfolded spectrum and mean diversity with the observed ones, computed
over windows left after dropping the lowest-diversity decile so that sweeps
do not get absorbed into the demography. Every proposal reuses one random
seed, which turns a noisy objective into a deterministic one and lets a
coarse random search plus local refinement converge.

It then simulates ten neutral replicates under the fitted history using the
provided recombination map, computes windowed diversity, Tajima's D, H12,
H2/H1 and the fraction of extreme nSL scores on both the observed genome and
the null, and converts each observed window to a z-score against null windows
in the same local-rate bin, combined across six statistics as -2 sum log p.
Calls are then made at the level of clusters rather than single windows,
formed at a mild threshold and judged by their total excess mass, with the
mass cut calibrated by applying the identical procedure to every null
replicate. A sweep footprint spans one to two megabases, so asking any single
window inside it to clear a genome-wide per-window cut is the wrong test:
measured on the shipped replicate the soft sweeps peaked a single point below
such a cut against a genome-wide median a quarter as large.

Run end to end on a genome simulated under the same history and the same
recombination map but with no selection anywhere, the pipeline reports zero
sweeps.

Classification is a nearest-centroid rule on four features read at the
detected peak: diversity and H2/H1 as ratios to background, Tajima's D and
the extreme-nSL fraction as differences. Single-feature thresholds are not
enough. On eight training replicates Tajima's D appeared to separate soft
sweeps with a gap of 0.46; with seven soft replicates instead of four it
overlaps by 1.59, and the best single feature gives 69% leave-one-out
accuracy against 90.6% for the four together. Each class is distinguished by
a different combination: a recent hard sweep is low on everything; an old one
looks the same except H2/H1 has recovered, because recombination broke up the
swept block; a soft sweep barely depresses diversity while pushing Tajima's D
positive; and a partial sweep is the only class with a strong nSL signal,
being the only one still segregating.

The selection coefficient comes from the width of the diversity trough times
the local recombination rate, with the width measured as the contiguous span
recovering halfway from the trough's own floor to background rather than
crossing half of background, which the shallow classes never do. With a
per-class constant this meets a factor-of-three tolerance on 91% of
replicates and on all of both hard classes. The completion time comes from
diversity recovery at the centre, with a class-specific bias removed, and is
reported only for single-origin completed sweeps.
"""

verification_explanation = """
Ground truth is the generator's own configuration plus the realized
trajectory the forward simulation recorded: the scheduled position of each
selected site, its selection coefficient, the generation at which the
beneficial allele passed 98% frequency, its final frequency, and how many
independent origins of it survived to the present. No solver, reference or
otherwise, contributes anything to it. The sealed truth file is static JSON
and the verifier runs no simulation at grading time.

Sweeps are matched to calls greedily by ascending distance, same chromosome,
within a window set from measured localisation spread rather than from the
reference's own error. Near-duplicate calls are collapsed first, so recall
cannot be manufactured by carpeting a region.

The gates are conjunctive: ancestral and current population size within a
factor, the bottleneck's duration-over-depth within a factor, a structural
check that the reported history really contracts and recovers, per-class
recall, a cap on calls matching no true sweep with cold-spot calls counting
against it, class accuracy over matched calls, selection coefficients within
a factor, and completion time within tolerance graded separately inside each
datable class.

Three choices are worth naming, each forced by a measurement rather than
chosen for neatness.

The bottleneck's depth and duration are not separately identifiable from the
spectrum, since the genealogy integrates duration over size. Across four
neutral replicates with known truth the reference was off by 2.4 to 2.6 times
on depth alone while recovering the combination to within 1.14 to 1.48, so
the gate is on the combination.

The bottleneck's timing is not graded at all. The same four fits placed the
expansion at 0.64, 0.68, 1.31 and 2.63 times its true time, so one in four
fails even a 40% tolerance and any tolerance admitting 2.63 is vacuous. The
objective has a broad flat minimum spanning roughly 1500 to 4000 generations
for a truth of 3000, so this reflects what a spectrum from 100 haplotypes
contains, not a failure of the search.

Timing is graded per class, and only for single-origin completed sweeps.
Graded in aggregate it was satisfiable by a constant, since the recent and
soft sweeps finish within a few hundred generations of each other. Soft
sweeps are excluded because diversity recovery dates a sweep by how far below
background its centre sits, which presumes the sweep drove diversity to zero;
a soft sweep leaves it at 0.74 of background and the estimator reads such
sweeps as eighteen times older than they are.

Eighteen submissions were run through the real verifier as a check. The
perfect answer passes and so does the perfect answer plus one false positive.
Fifteen degenerate ones fail: carpet bombing every 100 kb, a constant class,
a constant selection coefficient, two different constant timings, all
timings doubled, every call parked at a chromosome centre, all positions
shifted 400 kb, a flat constant-size history, submissions missing a class,
and NaN injection.
"""

